# Builds ipaforge.com and publishes it to GitHub Pages: the landing page, and the docs pages made from the
# IPAForge repository's own docs, release notes and error texts. It runs when the site changes, when the app
# publishes a release ("app-released", from IPAForge/ipaforge's release workflow), when what the docs pages are
# made from changes on the app's main ("app-docs-changed", from its website workflow), or by hand.
name: Deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [app-released, app-docs-changed]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer one waits rather than cancelling the one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The content the docs are made from, at the app's latest main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPAForge/ipaforge
          path: app
          sparse-checkout: |
            docs
            packages/ui/src/locales/en.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: node scripts/build.mjs
        env:
          CONTENT_DIR: app
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
